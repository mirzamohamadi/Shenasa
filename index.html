<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="referrer" content="no-referrer"/>
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'"/>
  <!-- frame-ancestors is NOT valid in a <meta> CSP (browsers ignore it and
       log a warning); it is delivered as an HTTP header by the Caddy/nginx
       configs in deploy/. -->
  <title>Shenasa — Kanidm Administration</title>
  <meta name="description" content="Shenasa: a modern administration UI for the Kanidm identity management server."/>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233b6ea5'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='white'/%3E%3C/svg%3E"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
  <!-- Login screen (rendered by app.js when no session exists) -->
  <div id="login-root" class="hidden"></div>

  <!-- Application shell (rendered by app.js when authenticated) -->
  <div id="app-root" class="hidden"></div>

  <noscript>
    <p style="padding:2rem;font-family:system-ui,sans-serif">
      Shenasa requires JavaScript. It is a single-page application that talks
      directly to your Kanidm server.
    </p>
  </noscript>

  <!-- Load order matters: plain scripts, no modules, no build step. -->
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/store.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/qrcode.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
